#--------------------------------------------------------------------------------------------------
# Description  : Package definition of peakrdl-pdflight, a PeakRDL exporter that writes the
#                register map as a PDF. The entry point at the end registers the subcommand
#                "peakrdl pdflight" when the package is pip-installed.
# Updated      : yyyy-mm-dd / author - comments
#--------------------------------------------------------------------------------------------------

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "peakrdl-pdflight"
version = "0.1.0"
description = "PeakRDL exporter: register map documentation as a PDF"
readme = "README.md"
license = {text = "Apache-2.0 OR MIT"}
authors = [{name = "DV"}]
requires-python = ">=3.7"
dependencies = [
    "systemrdl-compiler",
    "peakrdl-cli",
    "reportlab==5.1.0",     # pinned: the recorded version
]

[project.entry-points."peakrdl.exporters"]
pdflight = "peakrdl_pdflight.__peakrdl__:Exporter"
